[pytest]
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Warnings are errors. The suite ran with 1,523 warnings for months -- two
# deprecated APIs, test secrets shorter than the HMAC minimum, a renamed
# SDK client -- and nobody saw them because a wall of warnings hides the
# new one that matters. Zero is the baseline now; a new warning fails
# the build and gets fixed or explicitly ignored here with a reason.
filterwarnings =
    error
    # The MCP SDK's streamable-HTTP transport leaves anyio memory streams to
    # the garbage collector when a session closes; that is inside the SDK,
    # not this code, and it surfaces as a ResourceWarning plus pytest's
    # unraisable-exception wrapper around it.
    ignore:Unclosed <MemoryObject:ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
