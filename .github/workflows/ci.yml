name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postmortem_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postmortem_ai
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postmortem_ai
      DATABASE_SSL_MODE: disable
      GEMINI_API_KEY: ci-placeholder-not-used-tests-use-a-fake-provider
      SESSION_SECRET: ci-only-secret-not-used-in-production
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: pip install -r apps/api/requirements.txt

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install migration runner dependencies
        run: bun install

      - name: Apply migrations
        run: bun run scripts/migrate.mjs

      - name: Ruff
        run: ruff check apps/api

      - name: Pytest
        run: pytest apps/api/tests -q
        env:
          PYTHONPATH: apps/api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --cwd apps/web --frozen-lockfile

      - name: Typecheck
        working-directory: apps/web
        run: bun x tsc --noEmit -p .

      - name: Build
        run: bun run --cwd apps/web build
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
